# Example policy. Install to /etc/dau.conf (root:root, 0600).
#
# SECURITY: pinning a command is not enough — many binaries (less, vim,
# journalctl, awk, find, tar, python, ...) have shell-escapes or arbitrary
# file reads (GTFOBins). Only permit binaries you've verified have no such
# hatch. The blanket rule below is convenient but is logged as high-risk.
permit @wheel as root
